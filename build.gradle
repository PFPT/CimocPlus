buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.0.21"
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.52'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url "https://jitpack.io" }
        maven { url "https://maven.pkg.jetbrains.space/public/p/compose/dev" }
    }
    buildDir = file("${projectDir}/build.nosync")
}

subprojects { sub ->
    sub.afterEvaluate {
        sub.tasks.configureEach { task ->
            task.outputs.upToDateWhen {
                def outs = task.outputs.files.files
                outs.isEmpty() || outs.every { it.exists() }
            }
        }
        ["debug", "release"].each { variant ->
            def cap = variant.substring(0, 1).toUpperCase() + variant.substring(1)
            def packaged = file("${buildDir}/intermediates/packaged_res/${variant}/package${cap}Resources")
            def packageTask = tasks.findByName("package${cap}Resources")
            if (packageTask != null) {
                packageTask.outputs.upToDateWhen { packaged.isDirectory() }
            }
            def manifest = file("${buildDir}/intermediates/merged_manifest/${variant}/process${cap}Manifest/AndroidManifest.xml")
            def manifestTask = tasks.findByName("process${cap}Manifest")
            if (manifestTask != null) {
                manifestTask.outputs.upToDateWhen { manifest.isFile() }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
    subprojects { delete it.buildDir }
    delete file("${rootDir}/build")
    delete file("${rootDir}/app/build")
    delete file("${rootDir}/core/network/build")
    delete file("${rootDir}/core/database/build")
}
